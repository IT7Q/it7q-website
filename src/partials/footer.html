<footer class="site-footer">
  <div class="wrap site-footer__grid">
    <div>
      <a class="brand brand--footer" href="/" aria-label="IT7Q home">
        <svg class="brand__mark mark mark--master" viewBox="{{mark_viewbox}}" aria-hidden="true" focusable="false">
          <use href="#m-tl" class="mark__tl"/><use href="#m-tr" class="mark__tr"/><use href="#m-bl" class="mark__bl"/><use href="#m-br" class="mark__br"/>
        </svg>
        <span class="brand__name">IT7Q</span>
      </a>
      <p class="site-footer__tagline">{{site.tagline}}</p>
    </div>
    <div>
      <h2 class="site-footer__heading">Contact</h2>
      <ul class="plain">
        <li><a href="{{site.phone_href}}">{{site.phone}}</a></li>
        <li><a href="mailto:{{site.email}}">{{site.email}}</a></li>
        <li>{{site.locality}}</li>
      </ul>
    </div>
    <div>
      <h2 class="site-footer__heading">Explore</h2>
      <ul class="plain">
        <li><a href="/divisions/">Divisions</a></li>
        <li><a href="/services/">Services</a></li>
        <li><a href="/portfolio/">Portfolio</a></li>
        <li><a href="/access/">Investors &amp; partners</a></li>
      </ul>
    </div>
    <div>
      <h2 class="site-footer__heading">Legal</h2>
      <ul class="plain">
        <li><a href="/legal/privacy/">Privacy</a></li>
        <li><a href="/legal/terms/">Terms</a></li>
        <li><a href="/legal/nda/">NDA</a></li>
      </ul>
    </div>
  </div>
  <div class="wrap site-footer__base">
    <p>&copy; {{site.year}} {{site.name}} &middot; ABN {{site.abn}}</p>
  </div>
</footer>
